# /etc/xdg/foot/foot.ini
term=xterm-256color # foot # Done for compatibility reasons
font=JetBrainsMono Nerd Font:size=11
pad=2x2

[csd]
preferred=none # Hide window decoration

[colors-dark]
alpha=0.75
alpha-mode=matching
background=000000
foreground=ffffff

# Normal colors
regular0=050505
regular1=ff0000
regular2=00ff00
regular3=fcf802
regular4=0000ff
regular5=eb00fc
regular6=00defc
regular7=ffffff

# Bright colors
bright0=6d6d6d
bright1=fc5f2f
bright2=62fc20
bright3=f5fc35
bright4=0087ff
bright5=f049fc
bright6=00fcf8
bright7=ffffff
